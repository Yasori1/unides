                <ng-template carouselSlide>
                    <div class="partner-item">
                        <img src="images/partner/img1.png" alt="image">

                    <div class="partner-item">

                    <div class="partner-item">
                        <img src="images/partner/img4.png" alt="image">

                <ng-template carouselSlide>
                    <div class="partner-item">
                        <img src="images/partner/img5.png" alt="image">
                    </div>
                </ng-template>
                <ng-template carouselSlide>
                    <div class="partner-item">
                        <img src="images/partner/img6.png" alt="image">
                    </div>
                </ng-template>
                <ng-template carouselSlide>
                    <div class="partner-item">
                        <img src="images/partner/img1.png" alt="image">
                    </div>
                </ng-template>
                <ng-template carouselSlide>
                    <div class="partner-item">
                        <img src="images/partner/img2.png" alt="image">
                    </div>
