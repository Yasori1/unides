<nav class="navbar glass-transparent">
  <div class="container nav-content">
    <app-header-branding [isMobileMenuOpen]="isMobileMenuOpen" (toggleMenu)="toggleMobileMenu()">
    </app-header-branding>

    <!-- Backdrop -->
    <div
      class="mobile-backdrop"
      [class.active]="isMobileMenuOpen"
      (click)="closeMobileMenu()"
    ></div>

    <div class="nav-menu-wrapper" [class.active]="isMobileMenuOpen">
      <!-- Menu Header (Mobile Only) -->
      <div class="mobile-menu-header">
        <span class="menu-title">Menü</span>
        <!-- Close button removed to avoid duplicate X -->
      </div>

      <ul class="nav-links">
        <li>
          <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">
            <span class="material-symbols-outlined nav-icon">home</span>
            Ana Sayfa
          </a>
        </li>
        <li>
          <a routerLink="/communities" routerLinkActive="active-link" (click)="closeMobileMenu()">
            <span class="material-symbols-outlined nav-icon">groups</span>
            Topluluklar
          </a>
        </li>
        <li>
          <a routerLink="/events" routerLinkActive="active-link" (click)="closeMobileMenu()">
            <span class="material-symbols-outlined nav-icon">event</span>
            Etkinlikler
          </a>
        </li>
        <li>
          <a routerLink="/announcements" routerLinkActive="active-link" (click)="closeMobileMenu()">
            <span class="material-symbols-outlined nav-icon">campaign</span>
            Duyurular
          </a>
        </li>

        <li class="dropdown-parent" [class.mobile-expanded]="isMobileDropdownOpen">
          <a href="javascript:void(0)" routerLinkActive="active-link" (click)="toggleMobileDropdown()">
            <span class="material-symbols-outlined nav-icon">info</span>
            Bilgi <i class="icon-arrow-down" [class.rotated]="isMobileDropdownOpen"></i>
          </a>
          <ul class="dropdown-content">
            <li><a routerLink="/about" routerLinkActive="active-link" (click)="closeMobileMenu()">Hakkımızda</a></li>
            <li><a routerLink="/faq" routerLinkActive="active-link" (click)="closeMobileMenu()">SSS</a></li>
            <li><a routerLink="/contact" routerLinkActive="active-link" (click)="closeMobileMenu()">İletişim</a></li>
            <li><a routerLink="/developers" routerLinkActive="active-link" (click)="closeMobileMenu()">Geliştiriciler</a></li>
          </ul>
        </li>
      </ul>

      <!-- Mobile Menu Footer -->
      <div class="mobile-menu-footer">
        <div class="mobile-auth-footer" *ngIf="isInitialized && isLoggedIn === false">
          <a
            routerLink="/community-login"
            class="btn-outline-custom small static-btn"
            (click)="closeMobileMenu()"
            >Giriş Yap</a
          >
          <a routerLink="/register" class="btn-solid-custom small" (click)="closeMobileMenu()"
            >Kayıt Ol</a
          >
        </div>

        <div class="mobile-auth-footer" *ngIf="isInitialized && isLoggedIn === true">
          <!-- Öğrenci Dashboard şu an çalışmayacak (yorum satırında)
          <a *ngIf="userRole === 'student'" routerLink="/profile" class="btn-solid-custom small"
            (click)="closeMobileMenu()">{{ getDashboardLabel() }}</a>
          -->
          <a
            *ngIf="userRole === 'corporate'"
            routerLink="/corporate-dashboard"
            class="btn-solid-custom small"
            (click)="closeMobileMenu()"
            >{{ getDashboardLabel() }}</a
          >
          <a
            *ngIf="userRole === 'community'"
            routerLink="/community-dashboard"
            class="btn-solid-custom small"
            (click)="closeMobileMenu()"
            >{{ getDashboardLabel() }}</a
          >

          <button
            class="btn-outline-custom small static-btn"
            style="width: 100%; margin-top: 10px"
            (click)="logout()"
          >
            Çıkış Yap
          </button>
        </div>

        <p class="copyright">© 2026 ÜNİDES</p>
      </div>
    </div>
  </div>
</nav>
