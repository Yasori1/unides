<div class="magic-card-wrapper" #card>
  <!-- Glow Effect (Arka plan ışığı) -->
  <div class="card-glow"></div>

  <!-- Border Glow (Kenar Işığı) -->
  <div class="card-border"></div>

  <!-- Kart İçeriği -->
  <div class="card-content">
    <!-- Görsel -->
    <div class="image-container">
      <img [src]="project.image" [alt]="project.title" loading="lazy" />
      <div class="status-badge" [ngClass]="project.status">
        {{ project.status === 'active' ? 'Başvurular Açık' : 'Yakında' }}
      </div>
    </div>

    <!-- Metinler -->
    <div class="text-content">
      <div class="meta">
        <span class="category">{{ project.category }}</span>
        <span class="date"><i class="bx bx-calendar"></i> {{ project.date }}</span>
      </div>

      <h3>{{ project.title }}</h3>
      <p>{{ project.description }}</p>

      <div class="card-footer">
        <span class="location" *ngIf="project.location">
          <i class="bx bx-map"></i> {{ project.location }}
        </span>
        <a class="action-btn"> Detaylar <i class="bx bx-right-arrow-alt"></i> </a>
      </div>
    </div>
  </div>
</div>
