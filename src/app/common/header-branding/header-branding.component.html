<div class="header-branding-wrapper">
  <div class="brand">
    <a routerLink="/">
      <img src="assets/unides1.png" alt="ÜNİDES Logosu" class="logo-transparent" />
    </a>
  </div>

  <div class="right-actions" [class.initialized]="isInitialized">
    <!-- Mobile Toggle Button -->
    <button class="mobile-toggle" (click)="onToggleMenu()" [class.active]="isMobileMenuOpen">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <!-- Desktop Auth Buttons -->
    <div class="auth-buttons desktop-auth" *ngIf="isInitialized && isLoggedIn === false">
      <a routerLink="/community-login" class="btn-outline-custom small static-btn"
        ><span>Giriş Yap</span></a
      >
      <a routerLink="/register" class="btn-solid-custom small"><span>Kayıt Ol</span></a>
    </div>

    <!-- Profile Dropdown (Logged In Users) -->
    <!-- Sadece ikon görünür, tıklandığında kullanıcı adı dropdown içinde gösterilir -->
    <div
      class="profile-wrapper desktop-auth"
      *ngIf="
        isInitialized && isLoggedIn === true && (userRole !== 'community' || isCommunityNameLoaded)
      "
    >
      <div class="profile-info" (click)="toggleProfileDropdown($event)" title="Hesabım">
        <div class="profile-pic">
          <img
            *ngIf="communityLogo && userRole === 'community'"
            [src]="communityLogo"
            [alt]="displayName || 'Topluluk Logosu'"
          />
          <div class="profile-initial" *ngIf="!communityLogo || userRole !== 'community'">
            {{ userInitial }}
          </div>
        </div>
        <!-- Kullanıcı adı burada artık gösterilmiyor, dropdown içinde gösterilecek -->
      </div>
      <div
        class="dropdown-menu profile-dropdown"
        *ngIf="isProfileOpen"
        (click)="$event.stopPropagation()"
      >
        <!-- Kullanıcı adı ve rolü dropdown header'ında gösteriliyor -->
        <div class="dd-header">
          <div class="dd-user-name">{{ displayName || userName }}</div>
          <div class="dd-user-role">{{ getRoleDisplayName() }}</div>
        </div>
        <ul>
          <li (click)="navigateToDashboard()">
            <span class="material-symbols-outlined small-icon">{{ getDashboardIcon() }}</span>
            <span class="menu-text">{{ getDashboardLabel() }}</span>
          </li>
          <li (click)="handleSettingsClick()">
            <span class="material-symbols-outlined small-icon">person</span>
            <span class="menu-text">Profilim</span>
          </li>
          <li (click)="handleLogoutClick()" class="danger-item">
            <span class="material-symbols-outlined small-icon">logout</span>
            <span class="menu-text">Çıkış Yap</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
