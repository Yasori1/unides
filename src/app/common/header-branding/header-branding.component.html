<div class="header-branding-wrapper">
  <div class="brand">
    <a routerLink="/">
      <img src="assets/unides1.png" alt="ÜNİDES Logosu" class="logo-transparent" />
    </a>
  </div>

  <div class="right-actions">
    <!-- Mobile Toggle Button -->
    <button class="mobile-toggle" (click)="onToggleMenu()" [class.active]="isMobileMenuOpen">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <!-- Desktop Auth Buttons -->
    <div class="auth-buttons desktop-auth" *ngIf="isLoggedIn === false">
      <a routerLink="/login" class="btn-outline-custom small static-btn"><span>Giriş Yap</span></a>
      <a routerLink="/register" class="btn-solid-custom small"><span>Kayıt Ol</span></a>
    </div>

    <!-- Profile Dropdown (Logged In Users) -->
    <div class="profile-wrapper desktop-auth" *ngIf="isLoggedIn === true">
      <div class="profile-info" (click)="toggleProfileDropdown($event)">
        <div class="profile-pic">
          <div class="profile-initial">{{ userInitial }}</div>
        </div>
        <div class="profile-text">
          <div class="profile-name">{{ displayName || userName }}</div>
          <div class="profile-role">{{ getRoleDisplayName() }}</div>
        </div>
      </div>
      <div class="dropdown-menu profile-dropdown" *ngIf="isProfileOpen" (click)="$event.stopPropagation()">
        <div class="dd-header">{{ displayName || userName }}</div>
        <ul>
          <li (click)="navigateToDashboard()">
            <span class="material-symbols-outlined small-icon">dashboard</span>
            <span class="menu-text">{{ userRole === 'student' ? 'Profilim' : 'Panelim' }}</span>
          </li>
          <li (click)="handleSettingsClick()">
            <span class="material-symbols-outlined small-icon">person</span>
            <span class="menu-text">Profilim</span>
          </li>
          <li (click)="handleLogoutClick()" class="danger-item">
            <span class="material-symbols-outlined small-icon">logout</span>
            <span class="menu-text">Çıkış Yap</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
