<footer class="footer-section">
  <div class="container">
    <div class="footer-content">
      <!-- SOL TARA (Logo, Açıklama, Sosyal Medya) -->
      <div class="brand-area">
        <div class="logo-group">
          <!-- Logonuz varsa yorum satırını kaldırıp kullanabilirsiniz -->
          <!-- <img [src]="footerData.logo.src" [alt]="footerData.logo.alt" class="footer-logo"> -->
          <h2 class="logo-text">{{ footerData.logo.title }}</h2>
        </div>

        <p class="description">
          {{ footerData.description }}
        </p>

        <div class="contact-info">
          <p><i class="bx bx-map"></i> Ön Cebeci, Kıbrıs Caddesi No:4 Kurtuluş, Çankaya/Ankara</p>
        </div>

        <ul class="social-links">
          <li *ngFor="let social of socialLinks">
            <a [href]="social.href" [attr.aria-label]="social.label" target="_blank">
              <i [class]="social.icon"></i>
            </a>
          </li>
        </ul>
      </div>

      <!-- SAĞ TARAF (Link Kolonları) -->
      <div class="links-grid">
        <div *ngFor="let section of sections" class="link-column">
          <h3>{{ section.title }}</h3>
          <ul>
            <li *ngFor="let link of section.links">
              <!-- Link kontrolü: http, mailto veya tel ile başlıyorsa normal a tag, değilse routerLink -->
              <ng-container
                *ngIf="
                  link.href.startsWith('http') ||
                    link.href.startsWith('mailto') ||
                    link.href.startsWith('tel');
                  else internalLink
                "
              >
                <a [href]="link.href">{{ link.name }}</a>
              </ng-container>
              <ng-template #internalLink>
                <a [routerLink]="link.href">{{ link.name }}</a>
              </ng-template>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- ALT KISIM (Copyright) -->
    <div class="footer-bottom">
      <p>{{ footerData.copyright }}</p>
      <div class="legal-links">
        <a routerLink="/terms-conditions">Kullanım Şartları</a>
        <a routerLink="/privacy-policy">Gizlilik Politikası</a>
      </div>
    </div>
  </div>
</footer>

<!-- Back to Top Button -->
<div (click)="scrollToTop()" class="go-top" [class.active]="isShow">
  <i class="bx bx-chevron-up"></i>
</div>
