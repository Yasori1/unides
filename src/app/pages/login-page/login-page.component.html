<!-- Google Fonts & Icons -->
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

<div class="main-container">
  <div class="split-layout">
    <!-- SOL TARAF: SPLINE 3D SAHNESİ -->
    <div class="visual-side">
      <spline-viewer
        url="https://prod.spline.design/gWnX-vzrht9nTCAi/scene.splinecode"
      ></spline-viewer>

      <div class="visual-overlay"></div>

      <div class="visual-content">
        <div class="brand-badge"><i class="bx bxs-graduation"></i> ÜNİDES</div>
        <div class="quote-container">
          <h1>Geleceğe<br />Hoş Geldin.</h1>
          <p>Kampüs hayatını dijitalleştiren platforma tekrar bağlan.</p>
        </div>
      </div>
    </div>

    <!-- SAĞ TARAF: MODERN FORM -->
    <div class="form-side">
      <div class="form-wrapper">
        <div class="mobile-logo"><i class="bx bxs-graduation"></i> ÜNİDES</div>

        <div class="header-text">
          <h3>Tekrar Merhaba! 👋</h3>
          <p>Hesabın yok mu? <a routerLink="/register" class="register-link">Hemen Kayıt Ol</a></p>
        </div>

        <form (submit)="onSubmit($event)">
          <!-- E-Posta Input -->
          <div class="input-group">
            <div class="icon-wrapper" [class.error-icon]="emailError">
              <i class="bx bx-envelope"></i>
            </div>
            <input
              type="email"
              (input)="validateStudentEmail($event)"
              placeholder="Öğrenci E-Posta (xxx@univ.edu.tr)"
              class="modern-input"
              [class.input-error]="emailError"
            />
          </div>

          <div *ngIf="emailError" class="error-message">
            <i class="bx bx-error-circle"></i> Sadece <b>.edu.tr</b> uzantılı öğrenci mailleri kabul
            edilmektedir.
          </div>

          <!-- Şifre Input -->
          <div class="input-group mt-3">
            <div class="icon-wrapper">
              <i class="bx bx-lock-alt"></i>
            </div>
            <input type="password" placeholder="Şifreniz" class="modern-input" />
          </div>

          <div class="form-actions">
            <label class="remember-me">
              <input type="checkbox" />
              <span>Beni Hatırla</span>
            </label>
            <a href="javascript:void(0)" class="forgot-link">Şifremi Unuttum?</a>
          </div>

          <!-- Giriş Yap Butonu -->
          <button type="submit" class="btn-primary" [style.opacity]="emailError ? '0.7' : '1'">
            Giriş Yap <i class="bx bx-right-arrow-alt"></i>
          </button>

          <div class="divider">
            <span>veya</span>
          </div>

          <div class="social-login-grid">
            <!-- Yetkili Girişi -->
            <button type="button" class="btn-social btn-official" routerLink="/corporate-login">
              <div class="btn-content">
                <i class="bx bxs-id-card icon-official"></i>
                <div class="text-col">
                  <span class="btn-label">Kurumsal</span>
                  <span class="btn-title">Yetkili Girişi</span>
                </div>
              </div>
            </button>

            <!-- Topluluk Girişi -->
            <button type="button" class="btn-social btn-community" routerLink="/community-login">
              <div class="btn-content">
                <span class="emoji-icon">👥</span>
                <div class="text-col">
                  <span class="btn-label">Sosyal</span>
                  <span class="btn-title">Topluluk Girişi</span>
                </div>
              </div>
            </button>
          </div>
        </form>
      </div>

      <footer class="simple-footer">© T.C Gençlik ve Spor Bakanlığı</footer>
    </div>
  </div>
</div>

<!-- TOAST BİLEŞENİ BURADA -->
<app-toast></app-toast>
