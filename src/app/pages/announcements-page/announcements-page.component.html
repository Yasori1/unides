<app-site-navbar></app-site-navbar>

<div class="page-wrapper">
  <!-- Background Elements -->
  <div class="global-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container main-content">
    <div class="section-header-center fade-in-up">
      <h6 class="sub-title">GÜNCEL</h6>
      <h2 class="section-title">
        ÜNİDES <span class="highlight-text">DUYURULAR</span>
      </h2>
      <p class="section-desc">
        Üniversite ve kampüs yaşamına dair en güncel haberler ve duyurular.
      </p>
      <div class="blue-divider"></div>
    </div>

    <!-- Search Bar -->
    <div class="search-container fade-in-up">
      <div class="search-box">
        <i class="bx bx-search search-icon"></i>
        <input 
          type="text" 
          placeholder="Duyuru ara..." 
          (input)="onSearch($event)"
        >
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-state" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Duyurular yükleniyor...</p>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!isLoading && filteredAnnouncements.length === 0">
      <i class='bx bx-news'></i>
      <p>Aradığınız kriterlere uygun duyuru bulunamadı.</p>
    </div>

    <!-- Announcements Grid -->
    <div class="announcements-grid" *ngIf="!isLoading && filteredAnnouncements.length > 0">
      <a 
        [routerLink]="['/announcements', ann.id]" 
        class="announcement-card fade-in-up"
        *ngFor="let ann of filteredAnnouncements"
      >
        <div class="card-image">
          <img [src]="ann.image || 'assets/img/placeholder-announcement.jpg'" [alt]="ann.title" loading="lazy">
          <div class="date-badge">
            {{ formatDate(ann.date) }}
          </div>
        </div>
        <div class="card-content">
          <h3 class="card-title">{{ ann.title }}</h3>
          <p class="card-desc">{{ ann.shortDescription }}</p>
          <div class="card-footer">
            <span class="read-more">Devamını Oku <i class='bx bx-right-arrow-alt'></i></span>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>

<app-site-footer></app-site-footer>
