<app-site-navbar />

<!-- BANNER -->
<div class="page-spacer" (mousemove)="onHeroMouseMove($event)">
  <div class="background-wrapper">
    <div
      class="interactive-blob"
      [style.transform]="'translate(' + -heroMoveX + 'px, ' + -heroMoveY + 'px)'"
    ></div>
    <div class="noise-overlay"></div>
  </div>

  <div class="container relative-content">
    <h1 class="page-title">ÜNİDES <span class="highlight-text">GİZLİLİK POLİTİKASI</span></h1>
    <p class="page-subtitle">Şeffaflık ilkemizdir. Verilerinizi nasıl koruduğumuzu keşfedin.</p>
  </div>

  <div class="scroll-indicator">
    <span>İncele</span>
    <div class="line"></div>
  </div>
</div>

<!-- KARTLAR BÖLÜMÜ (GRID) -->
<section class="privacy-grid-section">
  <div class="container">
    <div class="cards-grid">
      <!-- DÖNGÜ İLE KARTLARI OLUŞTURUYORUZ -->
      <div class="display-card" *ngFor="let item of policyItems" (click)="openCard(item)">
        <!-- Kart Üstü (Header) -->
        <div class="card-header">
          <div class="icon-box">
            <span class="material-symbols-outlined">{{ item.icon }}</span>
          </div>
          <h3 class="card-title">{{ item.title }}</h3>
        </div>

        <!-- Kart Açıklaması -->
        <p class="card-desc">{{ item.description }}</p>

        <!-- Tarih -->
        <p class="card-date">{{ item.date }}</p>
      </div>
    </div>
  </div>
</section>

<!-- DETAY MODALI -->
<div class="policy-modal-backdrop" *ngIf="isModalOpen" (click)="closeCard()">
  <div class="policy-modal-content" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeCard()">
      <span class="material-symbols-outlined">close</span>
    </button>

    <div class="modal-header" *ngIf="selectedPolicy">
      <div class="modal-icon">
        <span class="material-symbols-outlined">{{ selectedPolicy.icon }}</span>
      </div>
      <h2>{{ selectedPolicy.title }}</h2>
    </div>

    <div class="modal-body" *ngIf="selectedPolicy">
      <div class="content-html" [innerHTML]="selectedPolicy.content"></div>
    </div>

    <div class="modal-footer">
      <button class="btn-confirm" (click)="closeCard()">Anladım</button>
    </div>
  </div>
</div>

<app-site-footer />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
/>
