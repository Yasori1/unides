<app-site-navbar />

<div class="developers-page">
  <!-- HERO ALANI -->
  <div class="hero-section">
    <!-- Developer Stream Animation -->
    <app-developer-stream [developerNames]="developerNames"></app-developer-stream>

    <!-- İçerik -->
    <div class="container text-center content-wrapper">
      <span class="badge">Takımımız</span>
      <h1 class="hero-title">Geleceği Kodlayanlar</h1>
      <p class="hero-subtitle">
        Ünides'i hayata geçiren, her satır kodda emeği olan tutkulu geliştirici ekibimizle tanışın.
      </p>
    </div>
  </div>

  <!-- GELİŞTİRİCİ KARTLARI GRID (Neurons Arka Planı Burada) -->
  <div class="team-grid-section">
    <!-- NEURONS BACKGROUND (BEYAZ ZEMİN, SOFT NÖRON ANİMASYONU) -->
    <div class="neurons-wrapper">
      <app-neurons-background
        [nodeCount]="60"
        [connectionDistance]="220"
      ></app-neurons-background>
    </div>

    <div class="container">
      <div class="grid-layout">
        <!-- Kartlar -->
        <div
          class="card-wrapper fade-in-up"
          *ngFor="let dev of developers; let i = index"
          [style.animation-delay]="i * 0.05 + 's'"
        >
          <app-profile-card
            [name]="dev.name"
            [title]="dev.title"
            [image]="dev.image"
            [work]="dev.work"
            [description]="dev.description"
            [backgroundImage]="dev.backgroundImage"
            [socialLinks]="dev.socialLinks"
          ></app-profile-card>
        </div>
      </div>
    </div>
  </div>
</div>

<app-site-footer />
