<app-site-navbar />

<div class="developers-page">
  <!-- HERO ALANI -->
  <div class="hero-section">
    <!-- Developer Stream Animation -->
    <app-developer-stream [developerNames]="developerNames"></app-developer-stream>

    <!-- İçerik -->
    <div class="container text-center content-wrapper">
      <span class="badge">Takımımız</span>
      <h1 class="hero-title">Geleceği Kodlayanlar</h1>
      <p class="hero-subtitle">
        Ünides'i hayata geçiren, her satır kodda emeği olan tutkulu geliştirici ekibimizle tanışın.
      </p>
    </div>
  </div>

  <!-- GELİŞTİRİCİ KARTLARI GRID (Neurons Arka Planı Burada) -->
  <div class="team-grid-section">
    <!-- NEURONS BACKGROUND (BEYAZ ZEMİN, SOFT NÖRON ANİMASYONU) -->


    <div class="container">
      <div class="grid-layout">
        <!-- Kartlar -->
        <div class="card-wrapper fade-in-up" *ngFor="let dev of developers; let i = index"
          [style.animation-delay]="i * 0.05 + 's'">
          <app-profile-card [name]="dev.name" [title]="dev.title" [image]="dev.image" [work]="dev.work"
            [description]="dev.description" [backgroundImage]="dev.backgroundImage"
            [socialLinks]="dev.socialLinks"></app-profile-card>
        </div>
      </div>

      <!-- DESTEK VERENLER SECTION -->
      <div class="supporters-section">
        <button class="supporters-toggle" (click)="toggleSupporters()" [class.open]="isSupportersOpen">
          Destek Verenler
          <span class="arrow-icon">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 7.5L10 12.5L15 7.5" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </span>
        </button>

        <div class="supporters-list" [class.open]="isSupportersOpen">
          <span *ngFor="let supporter of supporters" class="supporter-name">{{ supporter }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<app-site-footer />
