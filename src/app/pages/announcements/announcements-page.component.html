<app-header />

<app-page-banner [pageTitle]="'Duyurular'" [backgroundImage]="'images/tag.png'" />

<section class="blog-details-area ptb-100">
  <div class="container">
    <div class="row">
      <div class="col-lg-8">
        <div class="blog-details-content">
          <div class="announcements-list">
            
            <div *ngIf="announcements.length === 0" class="text-center py-5">
              <p>Duyurular yükleniyor veya henüz duyuru yok...</p>
            </div>

            <div class="announcement-card" *ngFor="let ann of announcements">
              <div class="announcement-header">
                <h3 class="announcement-title">
                  <a [routerLink]="['/duyuru', ann.annid]">{{ ann.title }}</a>
                </h3>
                <span class="badge bg-primary ms-2" *ngIf="isNew(ann.annDate)">Yeni</span>
              </div>
              
              <div class="announcement-meta text-muted small">
                <i class="far fa-calendar-alt me-1"></i> {{ ann.annDate | date:'dd.MM.yyyy' }}
              </div>
              
              <p class="mt-2">
                {{ 
                  ann.shortDescription.length > charLimit 
                  ? (ann.shortDescription | slice:0:charLimit) + '...' 
                  : ann.shortDescription 
                }}
              </p>

              <a [routerLink]="['/duyuru', ann.annid]" class="read-more-link"> Devamını Oku → </a>
            </div>
          </div>

          <nav aria-label="Duyuru Sayfaları" class="mt-4" *ngIf="announcements.length > 0">
            <ul class="pagination justify-content-center">
              <li class="page-item disabled">
                <span class="page-link">Önceki</span>
              </li>
              <li class="page-item active"><span class="page-link">1</span></li>
              
              <li class="page-item">
                <a class="page-link" href="javascript:void(0)">Sonraki</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>

      <div class="col-lg-4">
        <app-blog-sidebar></app-blog-sidebar>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
