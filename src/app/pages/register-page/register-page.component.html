<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

<div class="main-container">
  <div class="split-layout">
    <div class="visual-side">
      <div class="visual-overlay"></div>
      <div class="visual-content">
        <div class="brand-badge"><i class="bx bxs-graduation"></i> ÜNİDES</div>
        <div class="quote-container">
          <h1>Kampüs<br />Seni Bekliyor.</h1>
          <p>Ders notları, etkinlikler, kulüpler ve staj fırsatlarına tek bir yerden ulaş.</p>
        </div>
      </div>
    </div>

    <div class="form-side">
      <div class="form-wrapper">
        <div class="mobile-logo"><i class="bx bxs-graduation"></i> ÜNİDES</div>

        <div class="header-text">
          <h3>Öğrenci Kaydı</h3>
          <p>Zaten hesabın var mı? <a routerLink="/login" class="login-link">Giriş Yap</a></p>
        </div>

        <form (submit)="onSubmit($event)">
          <div class="input-group">
            <div class="icon-wrapper"><i class="bx bx-user"></i></div>
            <input type="text" placeholder="Ad Soyad" class="modern-input" required />
          </div>

          <div class="input-group">
            <div class="icon-wrapper" [class.error-icon]="emailError">
              <i class="bx bx-envelope"></i>
            </div>
            <input
              type="email"
              (input)="validateStudentEmail($event)"
              placeholder="Öğrenci E-Posta (xxx@univ.edu.tr)"
              class="modern-input"
              [class.input-error]="emailError"
              required
            />
          </div>
          <div *ngIf="emailError" class="error-message">
            <i class="bx bx-error-circle"></i> Sadece <b>.edu.tr</b> uzantılı öğrenci mailleri kabul
            edilmektedir.
          </div>

          <div class="input-group">
            <div class="icon-wrapper"><i class="bx bx-lock-alt"></i></div>
            <input
              type="password"
              (input)="checkPasswords($event, 'p1')"
              placeholder="Şifre"
              class="modern-input"
              required
            />
          </div>

          <div class="input-group">
            <div class="icon-wrapper" [class.error-icon]="passwordMismatch">
              <i class="bx bx-lock-alt"></i>
            </div>
            <input
              type="password"
              (input)="checkPasswords($event, 'p2')"
              placeholder="Şifreyi Onayla"
              class="modern-input"
              [class.input-error]="passwordMismatch"
              required
            />
          </div>
          <div *ngIf="passwordMismatch" class="error-message">
            <i class="bx bx-error-circle"></i> Şifreler eşleşmiyor.
          </div>

          <div class="form-actions checkbox-area">
            <label class="terms-label">
              <input type="checkbox" required />
              <span><a href="javascript:void(0)">Kullanıcı Sözleşmesi</a>'ni okudum.</span>
            </label>
          </div>

          <button
            type="submit"
            class="btn-primary"
            [style.opacity]="emailError || passwordMismatch ? '0.7' : '1'"
          >
            Öğrenci Olarak Kayıt Ol <i class="bx bx-right-arrow-alt"></i>
          </button>
        </form>
      </div>

      <footer class="simple-footer">© T.C Gençlik ve Spor Bakanlığı</footer>
    </div>
  </div>
</div>

<app-toast></app-toast>
