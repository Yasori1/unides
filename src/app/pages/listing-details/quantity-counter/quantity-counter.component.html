<div class="input-counter position-relative">
    <button (click)="decrement()" class="minus-btn border-0 p-0 transition cursor-pointer bg-transparent">
        <i class='bx bx-minus'></i>
    </button>
    <input type="number" class="d-block w-100 border-0 text-center border-radius" [(ngModel)]="value" />
    <button (click)="increment()" class="plus-btn border-0 p-0 transition cursor-pointer bg-transparent">
        <i class='bx bx-plus'></i>
    </button>
</div>
