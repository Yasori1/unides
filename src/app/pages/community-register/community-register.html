<!-- Google Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

<div class="main-container">
  <div class="split-layout">
    <!-- SOL TARAF: TOPLULUK GÖRSELİ -->
    <div class="visual-side">
      <div class="visual-overlay"></div>
      <div class="visual-content">
        <div class="brand-badge"><i class="bx bxs-graduation"></i> ÜNİDES</div>
        <div class="quote-container">
          <h1>Harekete<br />Geç.</h1>
          <p>Kendi topluluğunu oluştur, etkinlikler düzenle ve kampüsü canlandır.</p>
        </div>
      </div>
    </div>

    <!-- SAĞ TARAF: TOPLULUK FORM -->
    <div class="form-side">
      <div class="form-wrapper">
        <div class="mobile-logo"><i class="bx bxs-graduation"></i> ÜNİDES</div>
        <div class="header-text">
          <h3>Topluluk Oluştur 👥</h3>
          <p>
            Zaten hesabınız var mı?
            <a routerLink="/community-login" class="login-link">Giriş Yap</a>
          </p>
        </div>

        <app-toast></app-toast>

        <form (submit)="onSubmit($event)">
          <!-- Topluluk Bilgileri -->
          <div class="input-group">
            <div class="icon-wrapper"><i class="bx bx-group"></i></div>
            <input type="text" placeholder="Topluluk / Kulüp Adı" class="modern-input"
              (input)="updateCommunityName($event)" required />
          </div>

          <div class="input-group">
            <div class="icon-wrapper"><i class="bx bxs-school"></i></div>
            <input type="text" placeholder="Bağlı Olduğu Üniversite" class="modern-input"
              (input)="updateUniversity($event)" required />
          </div>

          <!-- Başkan Bilgileri -->
          <div class="input-group">
            <div class="icon-wrapper"><i class="bx bx-user-pin"></i></div>
            <input type="text" placeholder="Başkan / Temsilci Ad Soyad" class="modern-input"
              (input)="updateFullName($event)" required />
          </div>

          <div class="input-group">
            <div class="icon-wrapper" [class.error-icon]="emailError"><i class="bx bx-envelope"></i></div>
            <input type="email" placeholder="İletişim E-Postası (xxx@univ.edu.tr)" class="modern-input"
              [class.input-error]="emailError" (input)="validateCommunityEmail($event)" required />
          </div>
          <div *ngIf="emailError" class="error-message">
            <i class="bx bx-error-circle"></i> Lütfen geçerli bir topluluk e-postası (.edu.tr) giriniz.
          </div>

          <!-- Şifre -->
          <div class="input-group">
            <div class="icon-wrapper"><i class="bx bx-lock-alt"></i></div>
            <input type="password" (input)="checkPasswords($event, 'p1')" placeholder="Şifre" class="modern-input"
              required />
          </div>
          <app-password-strength-meter [password]="password" [showRequirements]="true"></app-password-strength-meter>

          <div class="input-group">
            <div class="icon-wrapper" [class.error-icon]="passwordMismatch">
              <i class="bx bx-lock-alt"></i>
            </div>
            <input type="password" (input)="checkPasswords($event, 'p2')" placeholder="Şifreyi Onayla"
              class="modern-input" [class.input-error]="passwordMismatch" required />
          </div>
          <div *ngIf="passwordMismatch" class="error-message">
            <i class="bx bx-error-circle"></i> Şifreler eşleşmiyor.
          </div>

          <div class="form-actions checkbox-area">
            <label class="terms-label">
              <input type="checkbox" required />
              <span><a href="javascript:void(0)">Topluluk Kuralları</a>'nı kabul ediyorum.</span>
            </label>
          </div>

          <button type="submit" class="btn-primary" [disabled]="isLoading">
            <app-luma-spin *ngIf="isLoading"></app-luma-spin>
            <span *ngIf="!isLoading">Topluluğu Kur <i class="bx bx-rocket"></i></span>
            <span *ngIf="isLoading">Gönderiliyor...</span>
          </button>
        </form>
      </div>
      <footer class="simple-footer">© T.C Gençlik ve Spor Bakanlığı</footer>
    </div>
  </div>
</div>
