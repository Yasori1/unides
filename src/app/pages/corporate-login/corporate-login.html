<!-- Google Fonts & Icons -->
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

<div class="main-container">
  <div class="split-layout">
    <!-- SOL TARAF: KURUMSAL GÖRSEL -->
    <div class="visual-side">
      <div class="visual-overlay"></div>
      <div class="visual-content">
        <div class="brand-badge"><i class="bx bxs-graduation"></i> ÜNİDES</div>
        <div class="quote-container">
          <h1>Kurumsal<br /></h1>
          <p>Yetkili Girişi</p>
        </div>
      </div>
    </div>

    <!-- SAĞ TARAF: FORM ALANI -->
    <div class="form-side">
      <div class="form-wrapper">
        <div class="mobile-logo"><i class="bx bxs-graduation"></i> ÜNİDES</div>

        <div class="header-text">
          <h3>Kurumsal Giriş</h3>
          <!-- <p>
            Partnerimiz değil misiniz?
            <a routerLink="/corporate-register" class="register-link">Başvuru Yap</a>
          </p> -->
        </div>

        <form (submit)="onSubmit($event)">
          <!-- Kurumsal E-Posta Input -->
          <div class="input-group">
            <div class="icon-wrapper" [class.error-icon]="emailError">
              <i class="bx bx-building-house"></i>
            </div>
            <input
              type="email"
              (input)="validateStudentEmail($event)"
              placeholder="Kurumsal E-Posta Adresi"
              class="modern-input"
              [class.input-error]="emailError"
            />
          </div>

          <!-- Hata Mesajı -->
          <div *ngIf="emailError" class="error-message">
            <i class="bx bx-error-circle"></i> Geçerli bir kurumsal e-posta giriniz.
          </div>

          <!-- Şifre Input -->
          <div class="input-group mt-3">
            <div class="icon-wrapper">
              <i class="bx bx-lock-alt"></i>
            </div>
            <input type="password" placeholder="Şifre" class="modern-input" />
          </div>

          <div class="form-actions">
            <label class="remember-me">
              <input type="checkbox" />
              <span>Beni Hatırla</span>
            </label>
            <a href="javascript:void(0)" class="forgot-link">Şifremi Unuttum?</a>
          </div>

          <!-- Giriş Butonu (Kurumsal Stil) -->
          <button type="submit" class="btn-primary" [style.opacity]="emailError ? '0.7' : '1'">
            Yönetim Paneline Gir <i class="bx bx-right-arrow-alt"></i>
          </button>

          <div class="divider">
            <span>veya</span>
          </div>

          <div class="social-login-grid">
            <!-- Standart (Öğrenci) Girişi - Bağlantı Yapıldı -->
            <button type="button" class="btn-social" routerLink="/login">
              <div class="btn-content">
                <i class="bx bxs-graduation icon-official"></i>
                <div class="text-col">
                  <span class="btn-label">Standart</span>
                  <span class="btn-title">Öğrenci Girişi</span>
                </div>
              </div>
            </button>

            <!-- Topluluk Girişi - Bağlantı Yapıldı -->
            <button type="button" class="btn-social btn-community" routerLink="/community-login">
              <div class="btn-content">
                <span class="emoji-icon">👥</span>
                <div class="text-col">
                  <span class="btn-label">Sosyal</span>
                  <span class="btn-title">Topluluk Girişi</span>
                </div>
              </div>
            </button>
          </div>
        </form>
      </div>

      <footer class="simple-footer">© T.C Gençlik ve Spor Bakanlığı</footer>
    </div>
  </div>
</div>
