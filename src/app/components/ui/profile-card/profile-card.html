<div class="developer-card" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
  <!-- Content -->
  <div class="card-content" [class.expanded]="isHovered">
    <!-- Profile Image Section -->
    <div class="profile-image-container">
      <img [src]="image" [alt]="name" class="profile-image" />
    </div>

    <!-- Blue Section: Social Links (on hover) -->
    <div class="social-section" *ngIf="isHovered && socialLinks">
      <div class="expanded-social">
        <a *ngIf="socialLinks.github" [href]="socialLinks.github" target="_blank" rel="noopener noreferrer"
          class="social-link github" title="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
          </svg>
        </a>
        <a *ngIf="socialLinks.linkedin" [href]="socialLinks.linkedin" target="_blank" rel="noopener noreferrer"
          class="social-link linkedin" title="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
          </svg>
        </a>
        <a *ngIf="socialLinks.twitter" [href]="socialLinks.twitter" target="_blank" rel="noopener noreferrer"
          class="social-link twitter" title="Twitter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z" />
          </svg>
        </a>
        <a *ngIf="socialLinks.instagram" [href]="socialLinks.instagram" target="_blank" rel="noopener noreferrer"
          class="social-link instagram" title="Instagram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
            <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z" />
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
          </svg>
        </a>
        <a *ngIf="socialLinks.website" [href]="socialLinks.website" target="_blank" rel="noopener noreferrer"
          class="social-link website" title="Website">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" />
          </svg>
        </a>
      </div>
    </div>

    <!-- Yellow Section: Long Description Text (on hover) -->
    <div class="description-section" *ngIf="isHovered && description">
      <p class="card-description-text">{{ description }}</p>
    </div>

    <!-- Red Section: Name and Title (always visible, moved to bottom) -->
    <div class="name-title-section">
      <h3 class="card-name">{{ name }}</h3>
      <p class="card-title" *ngIf="title">{{ title }}</p>
    </div>
  </div>
</div>
